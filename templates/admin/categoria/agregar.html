{% extends "admin/main.html" %}{% block titulo %}Nueva categoría{% endblock %}{% block contenido %}
<div class="admin-form-shell"><header class="admin-page-head"><div><span class="section-kicker">Carta nocturna</span><h1>Nueva categoría</h1><p>Crea una agrupación para organizar los productos.</p></div></header><section class="admin-card"><form action="{{ url_for('admin.categoria.guardar') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><div class="form-grid"><div class="field--full"><label for="nombreCategoria">Nombre de la categoría</label><input class="form-control" required maxlength="100" type="text" name="nombreCategoria" id="nombreCategoria" placeholder="Ej. Hamburguesas" /></div><div class="field--full"><label for="descripcion">Descripción</label><textarea class="form-control" required maxlength="255" rows="4" name="descripcion" id="descripcion" placeholder="Describe qué encontrará el cliente"></textarea></div></div><div class="form-actions"><a class="musas-btn musas-btn--secondary" href="{{ url_for('admin.categoria.home') }}">Cancelar</a><button class="musas-btn musas-btn--primary" type="submit">Guardar categoría</button></div></form></section></div>
{% endblock %}
