{% extends "admin/base.html" %}
{% block title %}Nueva categoría · Backoffice Las Musas{% endblock %}
{% block nav_categorias %}is-active{% endblock %}

{% block content %}
<div class="adm-head">
  <div>
    <h1>Nueva categoría</h1>
    <p><i class="bi bi-tags"></i> Aparece como sección en la carta de la tienda</p>
  </div>
  <a href="{{ url_for('admin.categoria.home') }}" class="adm-btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

<section class="adm-card">
  <form action="{{ url_for('admin.categoria.guardar') }}" method="post" class="adm-form">
    {{ campo_csrf() }}
    <div class="musa-field">
      <label class="musa-field-label" for="nombreCategoria">Nombre de la categoría</label>
      <input class="musa-input" required type="text" placeholder="Ej. Hamburguesas" name="nombreCategoria" id="nombreCategoria" />
    </div>
    <div class="musa-field">
      <label class="musa-field-label" for="descripcion">Descripción</label>
      <input required type="text" class="musa-input" placeholder="Texto corto que se muestra bajo el título" name="descripcion" id="descripcion" />
    </div>
    <div class="adm-form__acciones">
      <a href="{{ url_for('admin.categoria.home') }}" class="adm-btn-sm">Cancelar</a>
      <button type="submit" class="btn-brasa"><i class="bi bi-check-lg"></i> Guardar categoría</button>
    </div>
  </form>
</section>
{% endblock %}
