{% extends "admin/base.html" %}
{% block title %}Editar categoría · Backoffice Las Musas{% endblock %}
{% block nav_categorias %}is-active{% endblock %}

{% block content %}
<div class="adm-head">
  <div>
    <h1>Editar categoría</h1>
    <p><i class="bi bi-pencil"></i> {{ categoria[1] }}</p>
  </div>
  <a href="{{ url_for('admin.categoria.home') }}" class="adm-btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

<section class="adm-card">
  <form action="{{ url_for('admin.categoria.actualizar') }}" method="post" class="adm-form">
    <input type="hidden" name="idCategoria" value="{{ categoria[0] }}" />
    <div class="musa-field">
      <label class="musa-field-label" for="nombreCategoria">Nombre de la categoría</label>
      <input value="{{ categoria[1] }}" required type="text" class="musa-input" name="nombreCategoria" id="nombreCategoria" />
    </div>
    <div class="musa-field">
      <label class="musa-field-label" for="descripcion">Descripción</label>
      <input value="{{ categoria[2] }}" required type="text" class="musa-input" name="descripcion" id="descripcion" />
    </div>
    <div class="adm-form__acciones">
      <a href="{{ url_for('admin.categoria.home') }}" class="adm-btn-sm">Cancelar</a>
      <button type="submit" class="btn-brasa"><i class="bi bi-check-lg"></i> Guardar cambios</button>
    </div>
  </form>
</section>
{% endblock %}
