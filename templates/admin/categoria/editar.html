{% extends "admin/main.html" %}{% block titulo %}Editar categoría{% endblock %}{% block contenido %}
<div class="admin-form-shell"><header class="admin-page-head"><div><span class="section-kicker">Categoría #{{ categoria[0] }}</span><h1>Editar categoría</h1><p>Actualiza el nombre y la descripción visibles en la carta.</p></div></header><section class="admin-card"><form action="{{ url_for('admin.categoria.actualizar') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><input type="hidden" name="idCategoria" value="{{ categoria[0] }}" /><div class="form-grid"><div class="field--full"><label for="nombreCategoria">Nombre de la categoría</label><input class="form-control" required maxlength="100" type="text" name="nombreCategoria" id="nombreCategoria" value="{{ categoria[1] }}" /></div><div class="field--full"><label for="descripcion">Descripción</label><textarea class="form-control" required maxlength="255" rows="4" name="descripcion" id="descripcion">{{ categoria[2] }}</textarea></div></div><div class="form-actions"><a class="musas-btn musas-btn--secondary" href="{{ url_for('admin.categoria.home') }}">Cancelar</a><button class="musas-btn musas-btn--primary" type="submit">Guardar cambios</button></div></form></section></div>
{% endblock %}
