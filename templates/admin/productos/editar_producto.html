{% extends "admin/base.html" %}
{% block title %}Editar producto · Backoffice Las Musas{% endblock %}
{% block nav_productos %}is-active{% endblock %}

{% block content %}
<div class="adm-head">
  <div>
    <h1>Editar producto</h1>
    <p><i class="bi bi-pencil"></i> {{ producto['nombre'] }}</p>
  </div>
  <a href="{{ url_for('admin.productos.home') }}" class="adm-btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

<section class="adm-card">
  <form action="{{ url_for('admin.productos.actualizar') }}" method="post" class="adm-form">
    <input type="hidden" name="idProducto" value="{{ producto['idProducto'] }}" />
    <div class="musa-field">
      <label class="musa-field-label" for="categorias">Categoría</label>
      <select class="musa-input" name="categorias" id="categorias" required>
        {% for categoria in categorias %}
          <option value="{{ categoria[0] }}" {{ 'selected' if categoria[1] == producto['nombreCategoria'] }}>{{ categoria[1] }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="musa-field">
      <label class="musa-field-label" for="nombre">Nombre</label>
      <input value="{{ producto['nombre'] }}" required type="text" class="musa-input" name="nombre" id="nombre" />
    </div>
    <div class="musa-field">
      <label class="musa-field-label" for="descripcion">Descripción</label>
      <input value="{{ producto['descripcion'] }}" required type="text" class="musa-input" name="descripcion" id="descripcion" />
    </div>
    <div class="row g-3">
      <div class="col-sm-6 musa-field">
        <label class="musa-field-label" for="precio">Precio (S/)</label>
        <input value="{{ producto['precio'] or 0 }}" required type="number" step="0.10" min="0" class="musa-input" name="precio" id="precio" />
      </div>
      <div class="col-sm-6 musa-field">
        <label class="musa-field-label" for="existencias">Existencias</label>
        <input value="{{ producto['existencias'] }}" required type="number" min="0" class="musa-input" name="existencias" id="existencias" />
      </div>
    </div>
    <div class="adm-form__acciones">
      <a href="{{ url_for('admin.productos.home') }}" class="adm-btn-sm">Cancelar</a>
      <button type="submit" class="btn-brasa"><i class="bi bi-check-lg"></i> Guardar cambios</button>
    </div>
  </form>
</section>
{% endblock %}
