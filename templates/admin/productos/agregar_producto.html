{% extends "admin/main.html" %}{% block titulo %}Nuevo producto{% endblock %}{% block contenido %}
<div class="admin-form-shell"><header class="admin-page-head"><div><span class="section-kicker">Nueva preparación</span><h1>Agregar producto</h1><p>Completa la información que aparecerá en la carta.</p></div></header><section class="admin-card"><form action="{{ url_for('admin.productos.guardar') }}" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><div class="form-grid"><div><label for="categorias">Categoría</label><select class="form-select" required name="categorias" id="categorias"><option value="">Selecciona una categoría</option>{% for categoria in categorias %}<option value="{{ categoria[0] }}">{{ categoria[1] }}</option>{% endfor %}</select></div><div><label for="precio">Precio (S/)</label><input class="form-control" required type="number" min="0.01" step="0.01" name="precio" id="precio" placeholder="0.00" /></div><div class="field--full"><label for="nombre">Nombre del producto</label><input class="form-control" required maxlength="100" type="text" name="nombre" id="nombre" placeholder="Ej. Doble Brasa Smash" /></div><div class="field--full"><label for="descripcion">Descripción</label><textarea class="form-control" required maxlength="255" rows="4" name="descripcion" id="descripcion" placeholder="Ingredientes y preparación"></textarea></div><div><label for="existencias">Stock inicial</label><input class="form-control" required type="number" min="0" step="1" name="existencias" id="existencias" placeholder="0" /><small class="field-help">Unidades disponibles para venta.</small></div><div><label for="imagen">Imagen referencial</label><input class="form-control" required type="file" name="imagen" id="imagen" accept="image/jpeg,image/png,image/webp" /><small class="field-help">JPG, PNG o WEBP · máximo 5 MB.</small></div></div><div class="form-actions"><a class="musas-btn musas-btn--secondary" href="{{ url_for('admin.productos.home') }}">Cancelar</a><button class="musas-btn musas-btn--primary" type="submit">Publicar producto</button></div></form></section></div>
{% endblock %}
