{% extends "admin/base.html" %}
{% block title %}Nuevo producto · Backoffice Las Musas{% endblock %}
{% block nav_productos %}is-active{% endblock %}

{% block content %}
<div class="adm-head">
  <div>
    <h1>Nuevo producto</h1>
    <p><i class="bi bi-egg-fried"></i> Se agrega a la carta de la tienda</p>
  </div>
  <a href="{{ url_for('admin.productos.home') }}" class="adm-btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

<section class="adm-card">
  <form action="{{ url_for('admin.productos.guardar') }}" method="post" class="adm-form">
    <div class="musa-field">
      <label class="musa-field-label" for="categorias">Categoría</label>
      <select class="musa-input" name="categorias" id="categorias" required>
        {% for categoria in categorias %}
          <option value="{{ categoria[0] }}">{{ categoria[1] }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="musa-field">
      <label class="musa-field-label" for="nombre">Nombre</label>
      <input required type="text" class="musa-input" placeholder="Ej. Doble Tocino & Cheddar" name="nombre" id="nombre" />
    </div>
    <div class="musa-field">
      <label class="musa-field-label" for="descripcion">Descripción</label>
      <input required type="text" class="musa-input" placeholder="Ingredientes principales" name="descripcion" id="descripcion" />
    </div>
    <div class="row g-3">
      <div class="col-sm-6 musa-field">
        <label class="musa-field-label" for="precio">Precio (S/)</label>
        <input required type="number" step="0.10" min="0" class="musa-input" placeholder="0.00" name="precio" id="precio" />
      </div>
      <div class="col-sm-6 musa-field">
        <label class="musa-field-label" for="existencias">Existencias</label>
        <input required type="number" min="0" class="musa-input" placeholder="0" name="existencias" id="existencias" />
      </div>
    </div>
    <div class="adm-form__acciones">
      <a href="{{ url_for('admin.productos.home') }}" class="adm-btn-sm">Cancelar</a>
      <button type="submit" class="btn-brasa"><i class="bi bi-check-lg"></i> Guardar producto</button>
    </div>
  </form>
</section>
{% endblock %}
