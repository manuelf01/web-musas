name: tests

on:
  push:
    branches: [Ramirez, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Preparar cfg.py (solo para CI)
        run: |
          cat > cfg.py <<'EOF'
          host = '127.0.0.1'
          port = 3306
          db = 'db_musuas'
          username = 'root'
          password = ''
          secret_key = 'ci-test-secret-no-usar-en-prod'
          EOF

      - name: Esperar a MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot --silent && break
            echo "esperando MariaDB... ($i)"; sleep 2
          done

      - name: Pytest
        env:
          MUSAS_DB_HOST: "127.0.0.1"
        run: pytest -q
